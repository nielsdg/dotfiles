#!/usr/bin/ansible-playbook -K
---
- hosts: rpi
  gather_facts: no
  vars:
    docker_compose_dir: services/freshrss
    local_docker_compose_file: docker-compose.yml
  become: true

  tasks:
    - name: Create FreshRSS directory
      file:
        path: "{{ docker_compose_dir }}"
        state: directory
        mode: '0755'

    - name: Copy docker-compose.yml to remote
      copy:
        src: "{{ local_docker_compose_file }}"
        dest: "{{ docker_compose_dir }}/docker-compose.yml"
        mode: '0644'

    - name: Start FreshRSS container
      community.docker.docker_compose_v2:
        project_src: "{{ docker_compose_dir }}"
        state: present
